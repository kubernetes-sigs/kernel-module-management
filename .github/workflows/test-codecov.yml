name: Test and upload to Codecov

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

jobs:
  test-build:
    name: Test and upload to Codecov

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

    - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6
      with:
        go-version: '1.25'

    - name: Generate code
      run: make generate

    - name: Run tests
      run: make unit-test

    - name: Upload the coverage to Codecov
      uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6.0.0
      with:
        use_oidc: true
        # A failed upload is the problem this is fixing, so let it show on main.
        # A Codecov outage should still not block a contributor's pull request.
        fail_ci_if_error: ${{ github.event_name == 'push' }}
